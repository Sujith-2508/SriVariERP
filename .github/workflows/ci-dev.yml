name: CI Dev Gate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "20"

jobs:
  validate-scripts:
    name: Validate Required Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure required npm scripts exist
        run: |
          node -e "
          const p = require('./package.json');
          const scripts = p.scripts || {};
          const required = ['build','lint','typecheck','test:unit','test:integration'];
          const missing = required.filter((k) => !scripts[k]);
          if (missing.length) {
            console.error('Missing required scripts:', missing.join(', '));
            process.exit(1);
          }
          console.log('All required scripts are present.');
          "

  lint-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    needs: validate-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  build-web:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, integration-tests]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  quality-gate:
    name: Dev Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, integration-tests, build-web]
    steps:
      - name: Gate passed
        run: echo "All checks passed on dev. Safe to promote via PR to main."
